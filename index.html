<!doctype html>
<!--
  SEO Audit Verification:
  - Title: set via Helmet (SSG prerendered) ✓
  - Meta description: set via Helmet (SSG prerendered) ✓
  - Viewport: width=device-width, initial-scale=1 ✓
  - Hreflang: intentionally absent until URLs are language-addressable (see App.tsx, i18n-url-routing)
  - Canonical: set via Helmet (SSG prerendered) ✓
  - Schema.org LocalBusiness: set via Helmet (SSG prerendered) ✓
  - noindex: NOT present ✓
  - robots.txt: Allows / ✓
-->
<html lang="es" class="bg-sc-dark min-h-full">
  <head>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) — GA4 property for digitalizatenerife.es.
         The <script> tag itself is injected by the deferred loader below
         (design.md D2) — it never ships as a static, render-blocking tag. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      // Consent Mode v2 defaults (RGPD art.6 / LSSI-CE art.22.2): this
      // default (plus the dataLayer stub above and the stored-grant
      // restore right below) runs synchronously and FIRST, before
      // anything else in this file. gtag.js itself is NOT requested yet —
      // it loads deferred, after `load` + idle/interaction (see the
      // loader at the end of this script) — so every queued gtag() call
      // above replays in order, in one pass, once it parses the
      // dataLayer. No analytics cookies are set and no identifiable data
      // is stored until the user grants consent.
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        functionality_storage: "granted",
        security_storage: "granted",
      });

      // Restore a prior grant BEFORE config, so returning consented users
      // aren't measured as denied. Runs synchronously — no forced tag
      // delay is needed (design.md A3).
      // Keep in sync with src/shared/utils/consentStorage.ts
      // (CONSENT_KEY/VERSION/MAX_AGE_MS).
      try {
        var c = JSON.parse(localStorage.getItem("sc_consent_v1") || "null");
        if (
          c &&
          c.version === 1 &&
          c.categories &&
          c.categories.analytics === true &&
          Date.now() - c.timestamp < 63072000000
        ) {
          gtag("consent", "update", { analytics_storage: "granted" });
        }
      } catch (e) {
        // Storage blocked (e.g. Safari private mode) — stay denied.
      }

      gtag("js", new Date());

      // Analytics is scoped to public marketing routes only (design.md A2).
      // Single source of truth for React — see CookieConsent.tsx.
      window.__scAnalyticsScope = !/^\/(admin|panel|login)(\/|$)/.test(
        location.pathname,
      );
      if (window.__scAnalyticsScope)
        gtag("config", "G-F9KQ7X8TSQ", {
          allow_google_signals: false,
          allow_ad_personalization_signals: false,
        });

      // Deferred gtag.js load (design.md D2): nothing above requests the
      // network — it only pushes onto `dataLayer`. The actual <script>
      // tag is injected after `load` AND (idle, up to a 3s timeout, OR
      // the first pointerdown/keydown/touchstart/scroll), whichever
      // comes first, so it never competes with the critical rendering
      // path. Skipped entirely outside __scAnalyticsScope (admin/panel/
      // login).
      if (window.__scAnalyticsScope) {
        (function () {
          var injected = false;
          function injectGtagScript() {
            if (injected) return;
            injected = true;
            var gtagScript = document.createElement("script");
            gtagScript.async = true;
            gtagScript.src =
              "https://www.googletagmanager.com/gtag/js?id=G-F9KQ7X8TSQ";
            document.head.appendChild(gtagScript);
          }
          function scheduleDeferredLoad() {
            if (typeof window.requestIdleCallback === "function") {
              window.requestIdleCallback(injectGtagScript, { timeout: 3000 });
            } else {
              window.setTimeout(injectGtagScript, 3000);
            }
            ["pointerdown", "keydown", "touchstart", "scroll"].forEach(
              function (eventName) {
                window.addEventListener(eventName, injectGtagScript, {
                  once: true,
                  passive: true,
                });
              },
            );
          }
          window.addEventListener("load", scheduleDeferredLoad, {
            once: true,
          });
        })();
      }
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#030508"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafafa"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- Security -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://tysjedvujvsmrzzrmesr.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <style>
      html {
        background-color: var(--color-bg, #030508);
        min-height: 100%;
      }
      body {
        min-height: 100%;
        margin: 0;
        font-size: 16px;
      }
      @media (prefers-color-scheme: light) {
        html {
          background-color: var(--color-bg, #fafafa);
        }
      }
    </style>

    <!-- Inline theme init (prevents FOUC, uses system preference only) -->
    <script>
      (function () {
        if (window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body class="bg-sc-dark min-h-full">
    <div id="root" class="min-h-full"><!--ssr-outlet--></div>
    <script defer type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
