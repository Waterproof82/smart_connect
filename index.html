<!doctype html>
<!--
  SEO Audit Verification:
  - Title: set via Helmet (SSG prerendered) ✓
  - Meta description: set via Helmet (SSG prerendered) ✓
  - Viewport: width=device-width, initial-scale=1 ✓
  - Hreflang: intentionally absent until URLs are language-addressable (see App.tsx, i18n-url-routing)
  - Canonical: set via Helmet (SSG prerendered) ✓
  - Schema.org LocalBusiness: set via Helmet (SSG prerendered) ✓
  - noindex: NOT present ✓
  - robots.txt: Allows / ✓
-->
<html lang="es" class="bg-sc-dark min-h-full">
  <head>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) — GA4 property for digitalizatenerife.es -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-F9KQ7X8TSQ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      // Consent Mode v2 defaults (RGPD art.6 / LSSI-CE art.22.2): until
      // opt-in, ad/analytics storage is denied below. gtag.js itself still
      // loads and may send cookieless pings to Google (consent-mode ping),
      // but no analytics cookies are set and no identifiable data is stored
      // until the user grants consent.
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        functionality_storage: "granted",
        security_storage: "granted",
      });

      // Restore a prior grant BEFORE config, so returning consented users
      // aren't measured as denied. Runs synchronously — no forced tag
      // delay is needed (design.md A3).
      // Keep in sync with src/shared/utils/consentStorage.ts
      // (CONSENT_KEY/VERSION/MAX_AGE_MS).
      try {
        var c = JSON.parse(localStorage.getItem("sc_consent_v1") || "null");
        if (
          c &&
          c.version === 1 &&
          c.categories &&
          c.categories.analytics === true &&
          Date.now() - c.timestamp < 63072000000
        ) {
          gtag("consent", "update", { analytics_storage: "granted" });
        }
      } catch (e) {
        // Storage blocked (e.g. Safari private mode) — stay denied.
      }

      gtag("js", new Date());

      // Analytics is scoped to public marketing routes only (design.md A2).
      // Single source of truth for React — see CookieConsent.tsx.
      window.__scAnalyticsScope = !/^\/(admin|panel|login)(\/|$)/.test(
        location.pathname,
      );
      if (window.__scAnalyticsScope) gtag("config", "G-F9KQ7X8TSQ");
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#030508"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafafa"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- Security -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://tysjedvujvsmrzzrmesr.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <style>
      html {
        background-color: var(--color-bg, #030508);
        min-height: 100%;
      }
      body {
        min-height: 100%;
        margin: 0;
        font-size: 16px;
      }
      @media (prefers-color-scheme: light) {
        html {
          background-color: var(--color-bg, #fafafa);
        }
      }
    </style>

    <!-- Inline theme init (prevents FOUC, uses system preference only) -->
    <script>
      (function () {
        if (window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body class="bg-sc-dark min-h-full">
    <div id="root" class="min-h-full"><!--ssr-outlet--></div>
    <script defer type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
